<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- <script src="https://cdn.jsdelivr.net/gh/magiclen/ts-date-differencer/dist/date-differencer.min.js"></script> -->
        <script src="./dist/date-differencer.min.js"></script>
        <title>date-differencer</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>

    <body class="p-3 p-lg-5">
        <div id="demo-date-differencer" class="container">
            <div class="row g-3">
                <div class="col-12">
                    <div class="row g-2">
                        <div class="col-auto">
                            <input type="datetime-local" id="a" class="form-control" step="1" />
                        </div>
                        <div class="col-auto">
                            <input type="datetime-local" id="b" class="form-control" step="1" />
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <pre id="result"></pre>
                </div>
            </div>
        </div>

        <script>
            const a = document.getElementById("a");
            const b = document.getElementById("b");
            const result = document.getElementById("result");

            const diff = () => {
                try {
                    // A date-time string without a time zone is parsed in the local time zone.
                    const r = DateDifferencer.dateTimeDiff(new Date(a.value), new Date(b.value));

                    result.textContent = JSON.stringify(r, null, 4);
                } catch (error) {
                    result.textContent = error.message;
                }
            };

            a.addEventListener("input", diff);
            b.addEventListener("input", diff);

            const pad = (n) => String(n).padStart(2, "0");

            // `valueAsNumber` of a `datetime-local` input treats the local time as UTC, so use a local date-time string instead.
            const toLocalString = (date) =>
                `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;

            const now = toLocalString(new Date());

            a.value = now;
            b.value = now;

            diff();
        </script>
    </body>
</html>
